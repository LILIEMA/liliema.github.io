<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="robots" content="noindex, nofollow">

<title>Session wall · LILIEMA</title>

<style>
/* The session wall: a full-screen view for a projector. It starts empty when it is started and shows every word
   added with Add a word from then on, in tiles that keep their place and size. Sizes are taken from the tile
   (container units), so the wall looks the same on any screen. Latin script with LILIEMA's special letters in
   Noto Sans, Arabic script (with Ajami, Persian and Urdu letters) in Noto Sans Arabic, right to left; other scripts
   fall back to the computer's own fonts. */
:root {
  --bg: #022424; --tile: #08393a; --line: #1d5656; --text: #ffffff; --lang: #9fd9d6; --gold: #e9c548;
  --glow: rgba(233, 197, 72, .55); --muted: #8fb3b1;
  --font: 'Noto Sans', 'Noto Sans Arabic', system-ui, 'Segoe UI', sans-serif; --display: 'Noto Serif', Georgia, serif;
}
:root[data-theme="light"] {
  --bg: #eef3f3; --tile: #ffffff; --line: #c3dcdc; --text: #0f1414; --lang: #005a5a; --gold: #b38d12;
  --glow: rgba(179, 141, 18, .35); --muted: #56606b;
}
*, *::before, *::after { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { background: var(--bg); color: var(--text); font-family: var(--font); overflow: hidden; -webkit-user-select: none; user-select: none; }
body.running, body.running * { cursor: none !important; }
[hidden] { display: none !important; }
.brand { font-family: var(--display); font-weight: 700; color: var(--gold); letter-spacing: .1em; }

/* start screen, for the person who sets up the wall */
.intro { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; padding: 4vh 5vw; }
.intro-card { max-width: 1000px; text-align: center; }
.intro .brand { margin: 0 0 1.6vh; font-size: clamp(18px, 3vh, 34px); }
.intro h1 { margin: 0 0 2.6vh; font-family: var(--display); font-size: clamp(30px, 6vh, 72px); line-height: 1.1; }
.intro p { margin: 0 0 2.6vh; font-size: clamp(16px, 2.6vh, 30px); line-height: 1.45; color: var(--lang); }
.intro .start {
  margin: 1vh 0 3.4vh; padding: 1.6vh 3.4vw; border: 0; border-radius: 999px; cursor: pointer;
  font: 700 clamp(18px, 3vh, 34px) var(--font); color: #10201f; background: var(--gold);
}
.intro .start:focus-visible { outline: 4px solid var(--text); outline-offset: 4px; }
.intro .small { font-size: clamp(14px, 2vh, 24px); color: var(--muted); }
/* with pictures in the address: the first one on the start screen, so that it is clear before the start that it is set */
.intro-pic { margin: 0 0 3vh; display: flex; flex-direction: column; align-items: center; gap: 1.8vh; }
.intro-pic[hidden] { display: none; }
.intro-pic img { flex: none; width: clamp(90px, 17vh, 210px); height: clamp(90px, 17vh, 210px); box-sizing: border-box; padding: 1.4vh; object-fit: contain;
  background: #ffffff; border-radius: 1.4vh; box-shadow: 0 0 0 max(2px, .3vh) var(--gold); }
.intro-pic figcaption { text-align: center; font-size: clamp(16px, 2.6vh, 30px); line-height: 1.45; font-weight: 600; color: var(--text); }

/* the wall: a band with the title, then a fixed grid of tiles */
.wall { position: fixed; inset: 0; display: flex; flex-direction: column; gap: 1.4vh; padding: 1.8vh 1.4vw; }
.band { flex: 0 0 6.2vh; min-height: 0; display: flex; align-items: center; gap: 1.4vw; }
.band .brand { font-size: 3vh; }
.band h1 { margin: 0; min-width: 0; font-family: var(--display); font-weight: 700; font-size: 4.2vh; line-height: 1.1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.dots { margin-left: auto; display: flex; gap: .8vw; }
.dots span { width: 1.5vh; height: 1.5vh; border-radius: 50%; border: .25vh solid var(--muted); }
.dots span.on { background: var(--gold); border-color: var(--gold); }
.grid {
  flex: 1 1 auto; min-height: 0; display: grid; gap: 1.3vh .9vw;
  grid-template-columns: repeat(var(--cols), minmax(0, 1fr)); grid-template-rows: repeat(var(--rows), minmax(0, 1fr));
}
.tile {
  position: relative; min-width: 0; min-height: 0; container-type: size; overflow: hidden;
  background: var(--tile); border: max(2px, .3vh) solid var(--line); border-radius: 1.4vh;
}
.tile .in { position: absolute; inset: 0; padding: 0 6cqw; display: grid; grid-template-rows: 13% 38% 16% 2% 22% 9%; text-align: center; }
.tile .w { grid-row: 2; align-self: end; font-weight: 700; line-height: 1.12; white-space: nowrap; }
.tile .w.wrap { white-space: normal; overflow-wrap: anywhere; line-height: 1.08; overflow: hidden; display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2; }
.tile .l { grid-row: 3; align-self: start; padding-top: 1.5cqh; font-weight: 600; color: var(--lang); line-height: 1.2; white-space: nowrap; overflow: clip; overflow-clip-margin: .45em; text-overflow: ellipsis; }
.tile .eq { grid-row: 5; align-self: center; line-height: 1.15; white-space: nowrap; overflow: clip; overflow-clip-margin: .45em; text-overflow: ellipsis; }
.tile .eq::before { content: ''; display: block; width: 18cqw; height: max(2px, 1.1cqh); margin: 0 auto 2.2cqh; border-radius: 9px; background: var(--gold); }
.tile .eq .ew { font-weight: 700; }
.tile .eq .el { margin-left: .45em; font-weight: 600; color: var(--lang); }
/* Arabic script reaches further below the line than Latin: the word sits a little higher, clear of its language */
.tile .w.ar { margin-bottom: .3em; }
/* a new word fades in in half a second and is briefly outlined in gold; so is a tile that gets its second line */
.tile.fresh { z-index: 1; animation: tile-in .5s ease-out both, tile-glow 3.2s ease-out both; }
.tile.eq-fresh { z-index: 1; animation: tile-glow 3.2s ease-out both; }
.tile .eq.fresh { animation: tile-in .5s ease-out both; }
@keyframes tile-in { from { opacity: 0; } to { opacity: 1; } }
@keyframes tile-glow {
  0%, 20% { border-color: var(--gold); box-shadow: 0 0 0 max(2px, .35vh) var(--gold), 0 0 2.8vh var(--glow); }
  100% { border-color: var(--line); box-shadow: 0 0 0 0 transparent, 0 0 0 transparent; }
}

/* the code: a block of tiles in the bottom right corner, white in both themes so that phones read it well.
   Side by side on wide screens; on a nearly square block (4:3 screens) the code above the invitation. */
.qr-panel {
  position: relative; z-index: 2; min-width: 0; min-height: 0; container-type: size;
  background: #ffffff; color: #0d2626; border-radius: 1.4vh; box-shadow: 0 0 0 max(2px, .3vh) var(--gold);
}
.qr-inner {
  position: absolute; inset: 0; display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: center;
  column-gap: 4cqw; padding: 6cqh 4.5cqw;
}
.qr-inner img { display: block; width: min(86cqh, 56cqw); height: auto; aspect-ratio: 1; }
.qr-text { min-width: 0; }
.qr-call { margin: 0 0 4cqh; font-family: var(--display); font-weight: 700; font-size: min(8.6cqh, 5.2cqw); line-height: 1.15; }
.qr-scan { margin: 0 0 3cqh; font-weight: 700; font-size: min(6.6cqh, 4cqw); color: #8a6d12; }
.qr-addr { margin: 0; font-weight: 600; font-size: min(5cqh, 3.1cqw); color: #005a5a; }
@container (aspect-ratio < 29/20) {
  .qr-inner { grid-template-columns: minmax(0, 1fr); grid-template-rows: auto auto; justify-items: center; align-content: center; row-gap: 2.5cqh; padding: 4cqh 4cqw; text-align: center; }
  .qr-inner img { grid-row: 1; width: min(70cqh, 88cqw); }
  .qr-text { grid-row: 2; }
  .qr-call { margin: 0; font-size: min(5.6cqh, 4.9cqw); }
  .qr-scan, .qr-addr { display: none; }
}
.qr-panel.small .qr-inner { grid-template-columns: 1fr; justify-items: center; padding: 5cqh; }

/* the picture everyone answers (?pic=cat): a block of tiles in the middle of the wall, white like the code */
.pic-panel {
  position: relative; z-index: 2; min-width: 0; min-height: 0; container-type: size;
  background: #ffffff; color: #0d2626; border-radius: 1.4vh; box-shadow: 0 0 0 max(2px, .3vh) var(--gold);
}
.pic-inner { position: absolute; inset: 0; display: grid; grid-template-rows: minmax(0, 1fr) auto; justify-items: center; align-items: center;
  row-gap: 2cqh; padding: 5cqh 5cqw 6cqh; text-align: center; }
.pic-inner img { display: block; max-width: 100%; max-height: 100%; width: auto; height: 100%; aspect-ratio: 1; object-fit: contain; min-height: 0; }
.pic-call { margin: 0; font-family: var(--display); font-weight: 700; font-size: min(8cqh, 6.4cqw); line-height: 1.15; }
.pic-panel.small .pic-call { display: none; }
.pic-inner img.swap { animation: pic-in .6s ease-out both; }
@keyframes pic-in { from { opacity: 0; transform: scale(.94); } to { opacity: 1; transform: none; } }
.qr-panel.small .qr-text { display: none; }
.qr-panel.small .qr-inner img { width: min(90cqh, 90cqw); }

.fs-hint { position: fixed; left: 0; right: 0; bottom: .5vh; margin: 0; text-align: center; font-size: clamp(12px, 1.7vh, 20px); color: var(--muted); pointer-events: none; }
.toast {
  position: fixed; left: 50%; bottom: 4vh; transform: translateX(-50%); z-index: 11; padding: 1.2vh 2.4vw; white-space: nowrap;
  background: var(--tile); color: var(--text); border: .25vh solid var(--gold); border-radius: 999px; font-size: clamp(14px, 2.2vh, 28px);
}
.help { position: fixed; inset: 0; z-index: 10; display: flex; align-items: center; justify-content: center; background: rgba(0, 0, 0, .72); }
.help-card {
  max-width: 92vw; max-height: 92vh; overflow: auto; padding: 3vh 3vw; font-size: clamp(14px, 2.1vh, 28px); line-height: 1.4;
  background: var(--tile); color: var(--text); border: .3vh solid var(--gold); border-radius: 2vh;
}
.help-card h2 { margin: 0 0 2vh; font-family: var(--display); }
.help-card dl { display: grid; grid-template-columns: auto 1fr; gap: .9vh 2vw; margin: 0 0 2.2vh; }
.help-card dt { font-weight: 700; color: var(--gold); white-space: nowrap; }
.help-card dd { margin: 0; }
.help-card p { margin: 1vh 0 0; color: var(--lang); }
.help-card code { font-family: ui-monospace, Consolas, monospace; color: var(--text); }
@media (prefers-reduced-motion: reduce) {
  .tile.fresh, .tile .eq.fresh { animation: tile-in .5s linear both; }
  .tile.eq-fresh { animation: none; }
  .pic-inner img.swap { animation: tile-in .5s linear both; }
}
</style>

    });
    c.appendChild(dl);
    var st = document.createElement('p'), time = lastOk ? new Date(lastOk).toLocaleTimeString(F.locale()) : '';
    st.textContent = lastErr > lastOk ? F.t('sw.help.offline') + (lastOk ? ' · ' + F.t('sw.help.status', time, S ? words(S) : 0) : '')
      : lastOk ? F.t('sw.help.status', time, S ? words(S) : 0) : F.t('sw.help.never');
    c.appendChild(st);
    var db = document.createElement('p'), code = document.createElement('code');
    db.textContent = F.t('sw.help.db') + ' ';
    code.textContent = 'select * from clear_film_words();';
    db.appendChild(code);
    c.appendChild(db);
  }
  function toggleHelp(show) {
    var h = $('help');
    if (show === undefined) show = h.hidden;
    if (show) renderHelp();
    h.hidden = !show;
  }

  var nAt = 0;
  document.addEventListener('keydown', function (e) {
    if (e.ctrlKey || e.metaKey || e.altKey) return;
    var k = e.key;
    if (k === 'Enter') { e.preventDefault(); fullscreen(true); if (!running() && !busy) startSession(); return; }
    if (k === '?' || k === 'h' || k === 'H') { toggleHelp(); return; }
    if (k === 'Escape') { toggleHelp(false); return; }
    if (e.repeat) { if (k === 'Backspace' || k === 'Delete') e.preventDefault(); return; }   // held down: one press only
    if (k === 'd' || k === 'D') { if (demo) stopDemo(); else startDemo(); return; }
    if (k === 'l' || k === 'L') { setTheme(theme === 'dark' ? 'light' : 'dark'); return; }
    if (k === 'f' || k === 'F') { fullscreen(!document.fullscreenElement); return; }
    if (!running()) return;
    if (k === 'q' || k === 'Q') toggleQr();
    else if (k === 'p' || k === 'P') stepPic(e.shiftKey ? -1 : 1);
    else if (k === 'ArrowRight' || k === 'PageDown') go(1);
    else if (k === 'ArrowLeft' || k === 'PageUp') go(-1);
    else if (k === 'Backspace' || k === 'Delete') { e.preventDefault(); hideNewest(); }
    else if (k === 'n' || k === 'N') {
      if (Date.now() - nAt < 4000) {
        nAt = 0;
        if (demo) { clearTimeout(demoTimer); demo = null; }
        toast(F.t('sw.new'));
        startSession();
      } else { nAt = Date.now(); toast(F.t('sw.n.again')); }
    }
  });
  $('startBtn').addEventListener('click', function () { fullscreen(true); startSession(); });
  document.addEventListener('click', function (e) { if (running() && !e.target.closest('.help')) fullscreen(true); });
  document.addEventListener('fullscreenchange', hint);

  // Keep the screen on while the wall is shown (Screen Wake Lock), asked again when the page is visible and every minute
  var wakeLock = null, wakePending = false;
  function keepScreenOn() {
    if (wakeLock && wakeLock.released) wakeLock = null;
    if (!('wakeLock' in navigator) || wakeLock || wakePending || document.visibilityState !== 'visible') return;
    wakePending = true;
    navigator.wakeLock.request('screen').then(function (lock) {
      wakeLock = lock;
      lock.addEventListener('release', function () { wakeLock = null; });
    }).catch(function () { /* refused: the power settings decide */ }).then(function () { wakePending = false; });
  }
  document.addEventListener('visibilitychange', keepScreenOn);
  setInterval(keepScreenOn, 60000);

  // ------------------------------------------------------------ start
  setTheme(theme);
  $('grid').style.setProperty('--cols', COLS);
  $('grid').style.setProperty('--rows', ROWS);
  var qp = $('qrPanel');
  qp.style.gridColumn = (COLS - QS + 1) + ' / span ' + QS;
  qp.style.gridRow = (ROWS - QS + 1) + ' / span ' + QS;
  qp.classList.toggle('small', QS === 1);
  $('qrImg').src = 'assets/qr-session-' + F.lang + '.svg';
  $('qrImg').addEventListener('error', function () {
    var plain = 'assets/qr-session-' + F.lang + '.svg';
    if ($('qrImg').getAttribute('src') !== plain) $('qrImg').setAttribute('src', plain);
  });
  if (PICS.length) {
    var pp = $('picPanel'), first = PICS[0], firstName = first[F.lang] || first.en;
    pp.style.gridColumn = (PIC_BOX.c + 1) + ' / span ' + PIC_BOX.w;
    pp.style.gridRow = (PIC_BOX.r + 1) + ' / span ' + PIC_BOX.h;
    pp.classList.toggle('small', PIC_BOX.w === 1 || PIC_BOX.h === 1);
    $('introPicImg').src = first.picture;
    $('introPicImg').alt = firstName;
    $('introPicText').textContent = F.t('sw.intro.pic', firstName, PIC_ASK.length > 1 ? PICS.length : 1);
    $('introPic').hidden = false;
  }
  F.apply();
  keepScreenOn();
  if (document.fonts && document.fonts.load) {   // LILIEMA's letters ready before the first word is measured
    ['400', '600', '700'].forEach(function (w) {
      document.fonts.load(w + ' 40px "Noto Sans"', 'aɓɗŋñëéƴ ọ́ ắ');
      document.fonts.load(w + ' 40px "Noto Sans Arabic"', 'عربي');
    });
    document.fonts.load('700 40px "Noto Serif"', 'LILIEMA');
  }
  S = load();
  if (S) { cur = S; showWall(); render(); poll(); }   // a reload during a session: the same wall, and the words since
  else showIntro();
})();
</script>
</body>
</html>
