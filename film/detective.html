  // ------------------------------------------------------------ words for the game
  // Visitors' words in the fair's languages and the AI's words that speakers have not judged wrong
  function usable(w) { w = String(w || '').trim(); return w && (w.match(/\s+/g) || []).length <= MAX_SPACES && W.graphemes(w).length <= 30; }

  function candidates() {
    var byLang = {}, seen = {};
    function add(c) {
      var k = c.lang + '|' + W.exact(c.word);
      if (seen[k]) return;
      seen[k] = true;
      (byLang[c.lang] = byLang[c.lang] || []).push(c);
    }
    W.entries.forEach(function (e) {
      if (!e.language_slug || !W.language(e.language_slug) || !W.concept(e.concept_slug) || !usable(e.headword)) return;
      add({ word: String(e.headword).normalize('NFC'), lang: e.language_slug, concept: e.concept_slug, source: 'visitor' });
    });
    W.drafts.forEach(function (d) {
      if (!W.language(d.language_slug) || !W.concept(d.concept_slug) || W.status(d) === 'wrong' || !usable(d.draft)) return;
      add({ word: String(d.draft).normalize('NFC'), lang: d.language_slug, concept: d.concept_slug, source: 'ai', draft: d });
    });
    return byLang;
  }

  function shuffle(a) {
    for (var i = a.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)); var t = a[i]; a[i] = a[j]; a[j] = t; }
    return a;
  }

  // Words with letter clues, visitors' words and words with a picture come up more often
  function pick(list) {
    var w = list.map(function (c) {
      return (W.clues(c.word, c.lang).length ? 3 : 1) * (c.source === 'visitor' ? 2 : 1) * (W.concept(c.concept).picture ? 2 : 1);
    });
    var r = Math.random() * w.reduce(function (a, b) { return a + b; }, 0);
    for (var i = 0; i < list.length; i++) { r -= w[i]; if (r < 0) return list[i]; }
    return list[list.length - 1];
  }

  // Every language in which the same word occurs (ido is Hausa 'eye' and Somali 'sheep'): none of them may be
  // offered as a wrong option
  function sameWordLangs() {
    var m = {};
    var add = function (w, slug) { var x = W.exact(w); (m[x] = m[x] || {})[slug] = true; };
    W.entries.forEach(function (e) { if (e.language_slug) add(e.headword, e.language_slug); });
    W.drafts.forEach(function (d) { add(d.draft, d.language_slug); });
    return m;
  }

  // Four languages to choose from. Wrong options come from other countries, so that the country clue settles it;
  // often one of them writes the same special letters, so that the letter clue alone narrows it to two.
  function options(c, same) {
    var a = W.language(c.lang);
    var apart = function (l) { return !l.countries.some(function (k) { return a.countries.indexOf(k) >= 0; }); };
    var sharesLetters = {};
    W.clues(c.word, c.lang).forEach(function (x) { x.langs.forEach(function (s) { sharesLetters[s] = true; }); });
    var also = same[W.exact(c.word)] || {};
    var others = D.languages.filter(function (l) { return l.slug !== c.lang && !also[l.slug]; });
    var sharing = shuffle(others.filter(function (l) { return sharesLetters[l.slug] && apart(l); }));
    var rest = shuffle(others.filter(function (l) { return !sharesLetters[l.slug]; }));
    var picked = [];
    if (sharing.length && Math.random() < SHARE_CHANCE) picked.push(sharing[0]);
    rest.filter(apart).concat(rest.filter(function (l) { return !apart(l); }), sharing).forEach(function (l) {
      if (picked.length < 3 && picked.indexOf(l) < 0) picked.push(l);
    });
    return shuffle([a].concat(picked)).map(function (l) { return l.slug; });
  }

  // ------------------------------------------------------------ the game
  var game = null;

  function newGame() {
    var byLang = candidates(), same = sameWordLangs();
    var langs = shuffle(Object.keys(byLang));
    var rounds = langs.slice(0, ROUNDS).map(function (slug) {
      var c = pick(byLang[slug]);
      return { c: c, options: options(c, same), clues: 0, answer: null };
    });
    game = { rounds: rounds, pos: 0, right: 0 };
  }

  function round() { return game.rounds[game.pos]; }

  function showStep(id) {
    ['stepStart', 'stepGame', 'stepEnd'].forEach(function (s) { $(s).hidden = s !== id; });
    window.scrollTo(0, 0);
  }

  function start() {
    newGame();
    if (!game.rounds.length) { toStart(); return; }
    showStep('stepGame');
    renderRound();
    var first = $('options').querySelector('.option');
    if (first) first.focus({ preventScroll: true });
  }

  // the clues of a word: its special letters (if any), then the countries where its language is spoken
  function clueList(c) {
    var out = [];
    var groups = W.clueGroups(c.word, c.lang);
    if (groups.length) out.push({ kind: 'letters', groups: groups });
    out.push({ kind: 'country' });
    return out;
  }

  function lettersHtml(groups) {
    return groups.map(function (g) {
      var letters = g.letters.map(function (l) { return '<b>' + F.esc(l) + '</b>'; });
      var names = g.langs.map(function (s) { return F.esc(W.language(s).name); });
      return F.t('det.clue.letters', letters, names, names.length === 1, g.letters.length === 1 && g.letters[0] === 'ʼ');
    });
  }

  function countryHtml(c) {
    return F.t('det.clue.country', W.countryNames(W.language(c.lang)).map(F.esc));
  }

  function renderRound() {
    var r = round(), c = r.c, done = r.answer !== null;
    var countries = done || r.clues >= clueList(c).length;
    $('progress').textContent = F.t('det.progress', game.pos + 1, game.rounds.length);
    $('score').textContent = F.t('det.score', game.right);
    $('tag').className = 'tag ' + c.source;
    $('tag').textContent = c.source === 'ai' ? W.aiLabel(c.draft) : F.t('w.visitor');
    var showLetters = done || r.clues > 0;
    $('word').innerHTML = showLetters ? W.markClues(c.word, c.lang) : F.esc(c.word);
    if (done) $('word').setAttribute('lang', W.bcp47(c.lang)); else $('word').removeAttribute('lang');
    // options
    $('options').innerHTML = r.options.map(function (slug) {
      var cls = 'option';
      if (done && slug === c.lang) cls += ' correct';
      if (done && slug === r.answer && slug !== c.lang) cls += ' chosen-wrong';
      var mark = done && slug === c.lang ? '<span aria-hidden="true">✓</span>' : done && slug === r.answer ? '<span aria-hidden="true">✗</span>' : '';
      var where = countries ? '<small>' + F.esc(W.countryNames(W.language(slug)).join(', ')) + '</small>' : '';
      return '<button type="button" class="' + cls + '" data-lang="' + slug + '"' + (done ? ' disabled' : '') + '>' +
        '<span class="name">' + mark + F.esc(W.language(slug).name) + '</span>' + where + '</button>';
    }).join('');
    // clues, or the result once answered
    $('cluePanel').hidden = done;
    $('resultPanel').hidden = !done;
    if (!done) renderClues(); else renderResult();
  }

  function renderClues() {
    var r = round(), all = clueList(r.c), shown = all.slice(0, r.clues), html = [];
    shown.forEach(function (k) {
      if (k.kind === 'letters') lettersHtml(k.groups).forEach(function (h) { html.push('<li>' + h + '</li>'); });
      else html.push('<li>' + countryHtml(r.c) + '</li>');
    });
    $('clues').innerHTML = html.join('');
    $('clues').hidden = !html.length;
    $('clueBtn').hidden = r.clues >= all.length;
    $('clueBtn').textContent = '🔍 ' + F.t(r.clues ? 'det.clue.more' : 'det.clue');
  }

  function renderResult() {
    var r = round(), c = r.c, concept = W.concept(c.concept), lang = W.language(c.lang);
    var right = r.answer === c.lang;
    $('resultHead').className = 'result-head ' + (right ? 'right' : 'wrong');
    $('resultHead').textContent = F.t(right ? 'det.right' : 'det.wrong');
    $('resultLang').textContent = F.t('det.is', lang.name);
    $('meaning').innerHTML = (concept.picture ? '<img src="' + F.esc(concept.picture) + '" alt="">' : '') +
      '<div><div class="label" lang="' + F.lang + '">' + F.esc(W.label(concept)) + '</div><div class="others">' +
      W.otherLabels(concept).map(function (o) { return '<span lang="' + o.lang + '"><b>' + o.lang.toUpperCase() + '</b>' + F.esc(o.text) + '</span>'; }).join('') +
      '</div></div>';
    var facts = [];
    var groups = W.clueGroups(c.word, c.lang);
    if (groups.length) lettersHtml(groups).forEach(function (h) { facts.push('<li>' + h + '</li>'); });
    facts.push('<li>' + countryHtml(c) + '</li>');
    var src = c.source === 'ai' ? W.aiLabel(c.draft) + '. ' + F.t('w.said.' + W.status(c.draft)) : F.t('w.visitor.long') + '.';
    facts.push('<li class="src">' + F.esc(src) + '</li>');
    $('facts').innerHTML = facts.join('');
    $('nextBtn').textContent = F.t(game.pos + 1 < game.rounds.length ? 'det.next' : 'det.last');
  }

  function answer(slug) {
    var r = round();
    if (r.answer !== null) return;
    r.answer = slug;
    if (slug === r.c.lang) game.right++;
    renderRound();
    $('nextBtn').focus({ preventScroll: true });
    if (window.matchMedia('(max-width: 899px)').matches) $('resultPanel').scrollIntoView({ block: 'nearest', behavior: 'smooth' });
  }

  function next() {
    if (game.pos + 1 < game.rounds.length) { game.pos++; renderRound(); window.scrollTo(0, 0); return; }
    showEnd();
  }

  function showEnd() {
    var n = game.right, total = game.rounds.length, share = total ? n / total : 0;
    $('endScore').textContent = F.t('det.end.score', n, total);
    $('endText').textContent = F.t(n === total ? 'det.end.perfect' : share >= 0.7 ? 'det.end.good' : share >= 0.4 ? 'det.end.ok' : 'det.end.low');
    showStep('stepEnd');
    $('againBtn').focus({ preventScroll: true });
  }

  // ------------------------------------------------------------ the start screen
  var EXAMPLES = [['akan', 'ɛ'], ['yoruba', 'ẹ'], ['gikuyu', 'ũ'], ['wolof', 'ë'], ['hausa', 'ƙ'], ['ewe', 'ɖ']];
  function renderStart() {
    $('how').textContent = F.t('det.how', D.languages.length);
    // a few of the game's own words, with their clue letters marked
    var byLang = W.loaded ? candidates() : {};
    var ex = [];
    EXAMPLES.forEach(function (e) {
      var list = (byLang[e[0]] || []).filter(function (c) { return W.clues(c.word, c.lang).some(function (x) { return x.letter === e[1]; }); });
      if (list.length) ex.push('<span>' + W.markClues(list[0].word, e[0]) + '</span>');
    });
    $('examples').innerHTML = ex.slice(0, 4).join('');
    var playable = Object.keys(byLang).length > 0;
    $('startBtn').disabled = !playable;
    $('startNote').textContent = !W.loaded ? W.statusText() : playable ? (W.online === false ? W.statusText() : '') : F.t('det.soon');
  }

  function renderCredits() {
    $('aiCredit').textContent = F.t('credit.ai', S.MODEL, S.date(S.DRAFTED_ON));
    var pc = F.pictureCredit();
    $('picCredit').textContent = pc;
    $('picCredit').hidden = !pc;
  }

  function toStart() { game = null; renderStart(); showStep('stepStart'); }

  // ------------------------------------------------------------ idle reset for the next visitor
  var idleTimer = null;
  function resetIdle() {
    clearTimeout(idleTimer);
    idleTimer = setTimeout(function () { if (game || !$('stepEnd').hidden) toStart(); }, IDLE_RESET_MS);
  }
  ['pointerdown', 'keydown', 'touchstart', 'wheel'].forEach(function (ev) {
    window.addEventListener(ev, resetIdle, { passive: true });
  });

  // ------------------------------------------------------------ start
  F.initHeader();
  F.onLang(function () {
    renderCredits();
    if (!$('stepStart').hidden) renderStart();
    if (!$('stepGame').hidden && game) renderRound();
    if (!$('stepEnd').hidden && game) showEnd();
  });
  F.apply();
  renderCredits();
  W.onUpdate(function () { if (!$('stepStart').hidden) renderStart(); });
  W.start();

  $('startBtn').addEventListener('click', start);
  $('againBtn').addEventListener('click', start);
  $('restartBtn').addEventListener('click', start);
  $('options').addEventListener('click', function (e) {
    var b = e.target.closest('.option');
    if (b && !b.disabled) answer(b.getAttribute('data-lang'));
  });
  $('clueBtn').addEventListener('click', function () { round().clues++; renderRound(); });
  $('nextBtn').addEventListener('click', next);
  resetIdle();
})();
</script>
<script>window.FairVisit.guard();   // keeps a visit alive here and asks after a pause (visit.js)</script>
</body>
</html>
